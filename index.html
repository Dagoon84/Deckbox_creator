<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deckbox Creator</title>
<meta name="description" content="Kartenbox mit Rastkappe für den 3D-Druck erstellen und als 3MF herunterladen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: zwei Spalten – links Eingabe in vier Schritten, rechts Werkbank mit 3D-Vorschau und Download */
:root {
  --bg: #eef1f4;          /* kühles Grau, leicht blau wie PLA-Druckbett */
  --panel: #ffffff;
  --ink: #17212b;
  --muted: #5b6874;
  --line: #d3dae1;
  --box: #3f6f9a;         /* Box-Farbe (wie Vorschau) */
  --lid: #e8912d;         /* Kappen-Farbe */
  --accent: #2f5f8a;
  --accent-ink: #ffffff;
  --warn: #9a5a00;
  --error: #b3261e;
  --stage: #dfe5eb;
  --pp: #003087;          /* PayPal-Blau */
  --pp-ink: #ffffff;
  --pp-heart: #e8912d;
  --f-display: "Bricolage Grotesque", "Segoe UI", "Yu Gothic UI", "Malgun Gothic", "Noto Sans CJK JP", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", "Yu Gothic UI", "Meiryo", "Malgun Gothic", "Apple SD Gothic Neo", "Hiragino Sans", "Noto Sans CJK JP", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --panel: #18212a; --ink: #e6edf3; --muted: #93a1ae; --line: #2a3742;
    --box: #6f9fcc; --lid: #f0a24a; --accent: #7fb0dd; --accent-ink: #0d1620;
    --warn: #e0a54a; --error: #ff8a80; --stage: #0d1318; --pp: #ffc439; --pp-ink: #111111; --pp-heart: #003087; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #18212a; --ink: #e6edf3; --muted: #93a1ae; --line: #2a3742;
  --box: #6f9fcc; --lid: #f0a24a; --accent: #7fb0dd; --accent-ink: #0d1620;
  --warn: #e0a54a; --error: #ff8a80; --stage: #0d1318; --pp: #ffc439; --pp-ink: #111111; --pp-heart: #003087; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:lang(ko) body, :lang(ko) .fmt .nm { --f-body: "IBM Plex Sans", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", system-ui, sans-serif; word-break: keep-all; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 24px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.langsel { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; }
.langsel select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
.fmt .nm { font: 600 12px/1.2 var(--f-body); color: var(--muted); text-align: center; min-height: 2.4em; display: grid; place-items: center; }
.fmt[aria-pressed="true"] .nm { color: var(--accent); }
.formats { align-items: stretch; }
.fmt { align-content: space-between; }
h1 { font: 800 clamp(28px, 4vw, 40px)/1.05 var(--f-display); margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--lid); }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
@media (max-width: 880px) { main { grid-template-columns: minmax(0, 1fr); } }

.steps { display: grid; gap: 16px; }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; }
.step h2 { margin: 0; font: 600 17px/1.2 var(--f-display); display: flex; gap: 10px; align-items: baseline; }
.step h2 small { font: 500 12px var(--f-mono); color: var(--muted); letter-spacing: 0.04em; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }

.formats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.fmt {
  border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px;
  padding: 10px 6px 8px; display: grid; justify-items: center; gap: 6px; cursor: pointer; font: inherit;
}
.fmt:hover { border-color: var(--accent); }
.fmt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.fmt .card { border: 1.5px solid var(--muted); border-radius: 3px; background: color-mix(in srgb, var(--box) 12%, transparent); }
.fmt[aria-pressed="true"] .card { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
.fmt .lbl { font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; }
.fmt .card.custom { border-style: dashed; }

.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 8px 16px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fields.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 420px) { .fields { grid-template-columns: minmax(0, 1fr); } }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
input[type=number] {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
  color: var(--ink); font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums;
}
input.edited { border-color: var(--lid); }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bench { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; gap: 14px; }
.stage { background: var(--stage); border: 1px solid var(--line); border-radius: 10px; aspect-ratio: 4 / 3; max-width: 100%; position: relative; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage .status { position: absolute; left: 12px; bottom: 10px; font: 12px var(--f-mono); color: var(--muted); }
.legend { position: absolute; right: 12px; top: 10px; display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.specs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.specs div { background: var(--panel); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.specs dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.specs dd { margin: 0; font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (max-width: 420px) { .specs { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.msg { margin: 0; font-size: 13px; }
.msg.warn { color: var(--warn); }
.msg.error { color: var(--error); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 8px;
  padding: 10px 16px; font: 600 15px var(--f-body); cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.support {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
}
.support-text { min-width: 0; flex: 1 1 280px; }
.support h2 { margin: 0 0 2px; font: 600 17px/1.2 var(--f-display); }
.support p { margin: 0; color: var(--muted); font-size: 14px; }
.pp {
  display: inline-flex; align-items: center; gap: 9px; padding: 11px 20px; border-radius: 999px;
  background: var(--pp); color: var(--pp-ink); font: 600 15px var(--f-body); text-decoration: none;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--pp) 60%, black); transition: transform .12s ease, filter .12s ease;
}
.pp svg { color: var(--pp-heart); }
.pp:hover { filter: brightness(1.08); transform: translateY(-1px); }
.pp:active { transform: none; }
footer { color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 6px; max-width: 80ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Deckbox <span>Creator</span></h1>
      <label class="langsel" for="lang"><span data-i18n="lang">Sprache</span>
        <select id="lang"></select>
      </label>
    </div>
    <p data-i18n="tagline"></p>
  </header>

  <main>
    <section class="steps" aria-label="Input">
      <div class="step">
        <h2><span data-i18n="fmtH"></span> <small data-i18n="fmtS"></small></h2>
        <div class="formats" id="formats"></div>
        <div class="fields two" id="customCard" hidden>
          <label for="cardB"><span data-i18n="cardB"></span><input type="number" id="cardB" step="0.5" min="20" value="63.5"></label>
          <label for="cardL"><span data-i18n="cardL"></span><input type="number" id="cardL" step="0.5" min="40" value="88"></label>
        </div>
      </div>

      <div class="step">
        <h2 data-i18n="sleeves"></h2>
        <div class="seg" role="group">
          <button type="button" id="sleeveOn" aria-pressed="true" data-i18n="sleeveOn"></button>
          <button type="button" id="sleeveOff" aria-pressed="false" data-i18n="sleeveOff"></button>
        </div>
      </div>

      <div class="step">
        <h2><span data-i18n="deckH"></span> <small data-i18n="deckS"></small></h2>
        <div class="fields two">
          <label for="deck"><span data-i18n="deck"></span><input type="number" id="deck" step="0.5" min="1" value="20"></label>
          <label for="count"><span data-i18n="count"></span><input type="number" id="count" step="1" min="1" data-i18n-ph="countPh"></label>
        </div>
        <p class="hint" id="countHint"></p>
      </div>

      <div class="step">
        <h2><span data-i18n="innerH"></span> <small data-i18n="innerS"></small></h2>
        <div class="fields">
          <label for="innerB"><span data-i18n="innerB"></span><input type="number" id="innerB" step="0.1" min="22"></label>
          <label for="innerL"><span data-i18n="innerL"></span><input type="number" id="innerL" step="0.1" min="45"></label>
          <label for="innerH"><span data-i18n="innerHt"></span><input type="number" id="innerH" step="0.1" min="9"></label>
        </div>
        <div class="row">
          <p class="hint" data-i18n="innerHint"></p>
          <button type="button" class="linkbtn" id="resetInner" data-i18n="reset" hidden></button>
        </div>
      </div>
    </section>

    <section class="bench" aria-label="Result">
      <div class="stage" id="stage">
        <div class="legend"><span><i style="background:var(--box)"></i><span data-i18n="box"></span></span><span><i style="background:var(--lid)"></i><span data-i18n="lid"></span></span></div>
        <div class="status" id="status"></div>
      </div>
      <dl class="specs">
        <div><dt data-i18n="outer"></dt><dd id="sOuter">–</dd></div>
        <div><dt data-i18n="height"></dt><dd id="sHeight">–</dd></div>
        <div><dt data-i18n="weight"></dt><dd id="sWeight">–</dd></div>
      </dl>
      <p class="msg" id="msg"></p>
      <div class="actions">
        <button type="button" class="btn primary" id="build" disabled data-i18n="build"></button>
        <button type="button" class="btn" id="dlBoth" disabled data-i18n="dlBoth"></button>
        <button type="button" class="btn" id="dlBox" disabled data-i18n="dlBox"></button>
        <button type="button" class="btn" id="dlLid" disabled data-i18n="dlLid"></button>
      </div>
    </section>
  </main>

  <aside class="support" aria-labelledby="supportH">
    <div class="support-text">
      <h2 id="supportH" data-i18n="supportH"></h2>
      <p data-i18n="supportP"></p>
    </div>
    <a class="pp" href="https://paypal.me/Dag00n" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.4 2.5.8-1.4 2.3-2.5 4.4-2.5 3.8 0 5.9 4 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <span data-i18n="supportBtn"></span>
    </a>
  </aside>

  <footer>
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
  </footer>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
